[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant-platform"
version = "0.1.0"
description = "TravelFlow demo Telegram bot"
requires-python = ">=3.11,<3.14"
dependencies = [
	"aiogram>=3.20,<4.0",
	"python-dotenv>=1.0,<2.0",
]

[project.scripts]
travelflow-bot = "src.bot.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
