[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant-platform"
version = "0.1.0"
description = "Minimal runnable scaffold for a travel assistant bot"
requires-python = ">=3.13"
dependencies = [
	"aiogram>=3.0,<4.0",
	"python-dotenv>=1.0,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
